name: CI

on:
  push:
    branches: [main, integration/android-hardening]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Integrity check (syntax, references, duplicates, service worker)
        run: node tools/check.js
      - name: Unit tests
        run: node tools/test.js
