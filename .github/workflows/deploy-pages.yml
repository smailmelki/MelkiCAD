name: Publish MelkiCAD

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tools/**'
      - '.github/workflows/deploy-pages.yml'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'src/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: melkicad-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify source (syntax, file references, service-worker cache list)
        run: node tools/check.js

      - name: Unit tests
        run: node tools/test.js

      - name: Prepare site
        run: |
          mkdir _site
          cp -a src/. _site/
          # ختم إصدار الكاش برقم الإيداع: يتحدّث التطبيق عند المستخدمين تلقائيًا دون رفع VER يدويًا
          sed -i "s/^const VER='[^']*';/const VER='plan-${GITHUB_SHA::8}';/" _site/sw.js
          grep -n "^const VER=" _site/sw.js

      - name: Publish site
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./_site
          destination_dir: ${{ github.event_name == 'pull_request' && format('preview/pr-{0}', github.event.pull_request.number) || '' }}
          keep_files: ${{ github.event_name == 'pull_request' }}
          force_orphan: ${{ github.event_name != 'pull_request' }}
