name: Publish MelkiCAD

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tools/check.js'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: melkicad-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify source (syntax, file references, service-worker cache list)
        run: node tools/check.js

      - name: Prepare site
        run: |
          mkdir _site
          cp -a src/. _site/

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./_site
          force_orphan: true
