name: Build and publish MelkiCAD

on:
  push:
    branches: [main]
    paths:
      - 'planAotuCAD-full444.zip'
      - 'melkicad-properties.patch.gz'
      - 'melkicad-autofit.patch'
      - 'melkicad-move.patch'
      - 'melkicad-move-ui.patch'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: melkicad-publish
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare website files
        run: |
          set -e
          test -f planAotuCAD-full444.zip
          mkdir -p _site
          unzip -q planAotuCAD-full444.zip -d _site
          if [ -d _site/planAotuCAD ]; then
            if [ -f melkicad-properties.patch.gz ]; then
              gzip -dc melkicad-properties.patch.gz | patch --batch --forward -p1 -d _site/planAotuCAD
            fi
            if [ -f melkicad-autofit.patch ]; then
              patch --batch --forward -p1 -d _site/planAotuCAD < melkicad-autofit.patch
            fi
            if [ -f melkicad-move.patch ]; then
              patch --batch --forward -p1 -d _site/planAotuCAD < melkicad-move.patch
            fi
            if [ -f melkicad-move-ui.patch ]; then
              patch --batch --forward -p1 -d _site/planAotuCAD < melkicad-move-ui.patch
            fi
            cp -a _site/planAotuCAD/. _site/
            rm -rf _site/planAotuCAD
          fi
          test -f _site/index.html

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./_site
          force_orphan: true
