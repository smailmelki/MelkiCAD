name: Deploy MelkiCAD to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'planAotuCAD-full444.zip'
      - 'melkicad-properties.patch.gz'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare website files
        run: |
          test -f planAotuCAD-full444.zip
          mkdir -p _site
          unzip -q planAotuCAD-full444.zip -d _site
          if [ -d _site/planAotuCAD ]; then
            if [ -f melkicad-properties.patch.gz ]; then
              gzip -dc melkicad-properties.patch.gz | patch --batch --forward -p1 -d _site/planAotuCAD
            fi
            cp -a _site/planAotuCAD/. _site/
            rm -rf _site/planAotuCAD
          fi
          test -f _site/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
