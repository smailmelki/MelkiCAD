name: Build MelkiCAD Android Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-wrapper/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Checkout published website
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: android-wrapper/site

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        working-directory: android-wrapper
        run: npm install

      - name: Prepare web application
        working-directory: android-wrapper
        run: |
          mkdir -p www
          cp -a site/. www/
          rm -rf site
          npx esbuild android-bridge.js --bundle --format=iife --outfile=www/android-bridge.bundle.js
          node -e "const fs=require('fs');const p='www/index.html';let s=fs.readFileSync(p,'utf8');if(!s.includes('android-bridge.bundle.js')){s=s.replace('</body>','<script src=\"android-bridge.bundle.js\"></script>\n</body>');fs.writeFileSync(p,s)}"

      - name: Add Android platform
        working-directory: android-wrapper
        run: npx cap add android

      - name: Install native save-to-folder plugin
        working-directory: android-wrapper
        run: |
          mkdir -p android/app/src/main/java/com/smailmelki/melkicad
          cp -a native/android/. android/app/src/main/java/com/smailmelki/melkicad/

      - name: Sync Capacitor
        working-directory: android-wrapper
        run: npx cap sync android

      - name: Prepare release signing
        working-directory: android-wrapper/android
        env:
          ANDROID_KEYSTORE_BASE64: \${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PATH: \${{ runner.temp }}/MelkiCAD.keystore
          ANDROID_KEYSTORE_PASSWORD: \${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: \${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: \${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          test -s "$ANDROID_KEYSTORE_PATH"
          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle_file = Path("app/build.gradle")
          content = gradle_file.read_text()

          if "signingConfigs {" not in content:
              marker = re.search(r"(?m)^([ \t]*)buildTypes\s*\{", content)
              if not marker:
                  raise SystemExit("Could not find buildTypes block in app/build.gradle")
              indent = marker.group(1)
              signing = (
                  f"{indent}signingConfigs {{\n"
                  f"{indent}    release {{\n"
                  f"{indent}        storeFile file(System.getenv('ANDROID_KEYSTORE_PATH'))\n"
                  f"{indent}        storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')\n"
                  f"{indent}        keyAlias System.getenv('ANDROID_KEY_ALIAS')\n"
                  f"{indent}        keyPassword System.getenv('ANDROID_KEY_PASSWORD')\n"
                  f"{indent}    }}\n"
                  f"{indent}}}\n\n"
              )
              content = content[:marker.start()] + signing + content[marker.start():]

          build_types = re.search(r"(?s)buildTypes\s*\{(.*)", content)
          if not build_types:
              raise SystemExit("Could not find buildTypes block")
          release = re.search(r"(?m)^([ \t]*)release\s*\{", build_types.group(1))
          if not release:
              raise SystemExit("Could not find release build type")
          absolute = build_types.start(1) + release.end()
          if "signingConfig signingConfigs.release" not in content:
              content = content[:absolute] + "\n" + release.group(1) + "    signingConfig signingConfigs.release" + content[absolute:]

          gradle_file.write_text(content)
          PY

      - name: Build signed release APK and AAB
        working-directory: android-wrapper/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease

      - name: Upload signed release files
        uses: actions/upload-artifact@v4
        with:
          name: MelkiCAD-Android-Release
          path: |
            android-wrapper/android/app/build/outputs/apk/release/app-release.apk
            android-wrapper/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
