name: Build MelkiCAD Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-wrapper/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Checkout published website
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: android-wrapper/site

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: android-wrapper/package.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare web application
        working-directory: android-wrapper
        run: |
          mkdir -p www
          cp -a site/. www/
          rm -rf site
          npx --yes esbuild android-bridge.js --bundle --format=iife --outfile=www/android-bridge.bundle.js
          node -e "const fs=require('fs');const p='www/index.html';let s=fs.readFileSync(p,'utf8');if(!s.includes('android-bridge.bundle.js')){s=s.replace('</body>','<script src=\"android-bridge.bundle.js\"></script>\\n</body>');fs.writeFileSync(p,s)}"

      - name: Install dependencies
        working-directory: android-wrapper
        run: npm install

      - name: Add Android platform
        working-directory: android-wrapper
        run: npx cap add android

      - name: Sync Capacitor
        working-directory: android-wrapper
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android-wrapper/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MelkiCAD-Android-APK
          path: android-wrapper/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
