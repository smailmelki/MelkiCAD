name: Build MelkiCAD Android APK

# يُشغَّل يدويًا (Actions ← Run workflow) أو عند وسم إصدار v*، وليس مع كل دفع إلى main.
# إن وُجدت أسرار التوقيع يُبنى إصدار موقّع (release)، وإلا يُبنى APK تجريبي (debug) قابل للتثبيت.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js (for verification)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify source
        run: node tools/check.js && node tools/test.js

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install dependencies
        working-directory: android-wrapper
        run: npm install

      - name: Prepare offline web application
        working-directory: android-wrapper
        run: |
          mkdir -p www
          cp -a ../src/. www/
          # ختم إصدار الكاش برقم الإيداع حتى لا يخدم عامل الخدمة ملفات قديمة بعد تحديث التطبيق
          sed -i "s/^const VER='[^']*';/const VER='plan-${GITHUB_SHA::8}';/" www/sw.js
          npx esbuild android-bridge.js --bundle --format=iife --outfile=www/android-bridge.bundle.js
          node -e "const fs=require('fs');const p='www/index.html';let s=fs.readFileSync(p,'utf8');if(!s.includes('android-bridge.bundle.js')){s=s.replace('</body>','<script src=\\"android-bridge.bundle.js\\"></script>\\n</body>');fs.writeFileSync(p,s)}"

      - name: Add Android platform
        working-directory: android-wrapper
        run: npx cap add android

      - name: Install MelkiCAD launcher icons
        working-directory: android-wrapper
        run: cp -a native/res/. android/app/src/main/res/

      - name: Install native save-to-folder plugin
        working-directory: android-wrapper
        run: |
          mkdir -p android/app/src/main/java/com/smailmelki/melkicad
          cp -a native/android/. android/app/src/main/java/com/smailmelki/melkicad/

      - name: Sync Capacitor
        working-directory: android-wrapper
        run: npx cap sync android

      - name: Build debug APK (no signing secrets configured)
        if: env.HAS_KEYSTORE != 'true'
        working-directory: android-wrapper/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        if: env.HAS_KEYSTORE != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: MelkiCAD-Android-Debug
          path: android-wrapper/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build release APK
        if: env.HAS_KEYSTORE == 'true'
        working-directory: android-wrapper/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Decode Android release keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Missing ANDROID_KEYSTORE_BASE64 secret" && exit 1)
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/melkicad-release.jks"

      - name: Align and sign release APK
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD secret" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing ANDROID_KEY_ALIAS secret" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing ANDROID_KEY_PASSWORD secret" && exit 1)
          APK="android-wrapper/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -name zipalign -type f | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -f "$APK"
          "$ZIPALIGN" -v -p 4 "$APK" "$RUNNER_TEMP/app-release-aligned.apk"
          "$APKSIGNER" sign --ks "$RUNNER_TEMP/melkicad-release.jks" --ks-key-alias "$KEY_ALIAS" --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD --out "$RUNNER_TEMP/MelkiCAD-release.apk" "$RUNNER_TEMP/app-release-aligned.apk"
          "$APKSIGNER" verify --verbose "$RUNNER_TEMP/MelkiCAD-release.apk"

      - name: Upload signed Release APK
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: MelkiCAD-Android-Release
          path: ${{ runner.temp }}/MelkiCAD-release.apk
          if-no-files-found: error
          retention-days: 90
