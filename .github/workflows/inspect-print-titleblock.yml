name: Inspect print titleblock archive

on:
  push:
    branches:
      - preview/print-titleblock
    paths:
      - MelkiCAD-print-titleblock.zip
      - .github/workflows/inspect-print-titleblock.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          ref: preview/print-titleblock

      - name: Inspect ZIP contents
        shell: bash
        run: |
          set -euo pipefail
          test -f MelkiCAD-print-titleblock.zip
          echo "=== ZIP archive file list ==="
          unzip -Z1 MelkiCAD-print-titleblock.zip
          echo "=== ZIP summary ==="
          unzip -l MelkiCAD-print-titleblock.zip | tail -n 5
